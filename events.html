<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Upcoming campus events: sports, academics, social and faith.">
  <title>Events | Campus Life Super App</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <!-- Bootstrap first, then my styles -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- ===== HEADER / NAVIGATION ===== -->
  <header>
    <nav class="navbar navbar-expand-md navbar-dark bg-brand" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
          <img src="images/logo.svg" alt="" width="36" height="36">
          <span>Campus Life</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="events.html">Events</a></li>
            <li class="nav-item"><a class="nav-link" href="dining.html">Dining</a></li>
            <li class="nav-item"><a class="nav-link" href="clubs.html">Clubs</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main id="main" class="container my-5">
    <!-- ===== PAGE TITLE ===== -->
    <div class="page-header mb-4">
      <h1 class="fw-bold">Campus Events</h1>
      <p class="text-muted mb-0">Filter by category and RSVP to the events you want to attend.</p>
    </div>

    <!-- ===== FILTER BUTTONS: clicking one shows only that category (see script.js) ===== -->
    <div id="event-filters" class="d-flex flex-wrap gap-2 mb-4" role="group" aria-label="Filter events by category">
      <button type="button" class="btn btn-brand" data-category="all" aria-pressed="true">All</button>
      <button type="button" class="btn btn-outline-brand" data-category="sports" aria-pressed="false">Sports</button>
      <button type="button" class="btn btn-outline-brand" data-category="academic" aria-pressed="false">Academic</button>
      <button type="button" class="btn btn-outline-brand" data-category="social" aria-pressed="false">Social</button>
      <button type="button" class="btn btn-outline-brand" data-category="faith" aria-pressed="false">Faith</button>
    </div>

    <!-- Counter of RSVPs, updated every time the user clicks an RSVP button -->
    <p class="small text-muted" aria-live="polite">You are going to <strong id="rsvp-count">0</strong> event(s).</p>

    <!-- ===== EVENT LIST: cards are generated by JavaScript from an array of events ===== -->
    <div id="event-list" class="row g-4">
      <!-- JavaScript inserts the event cards here -->
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="bg-dark text-light py-4 mt-auto">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2 small">
      <p class="mb-0">&copy; <span id="year"></span> Campus Life Super App</p>
      <p class="mb-0">Weather data by <a class="link-light" href="https://open-meteo.com/">Open-Meteo</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/script.js"></script>
</body>
</html>
